version: "3.8"

# Fuer den portablen Einsatz: nutzt NUR das per "docker load" eingespielte Image,
# baut nichts selbst (kein Quellcode/Dockerfile auf der Zielmaschine notwendig).
services:
  app:
    image: einlasskontrolle:latest
    container_name: einlasskontrolle
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      POSTGRES_DB: einlass_db
      POSTGRES_USER: einlass_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      APP_URL: ${APP_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}   # optional: aktiviert den Chat in den Statistiken
      BACKUP_API_KEY: ${BACKUP_API_KEY:-}         # optional: aktiviert den MCP-Backup-Importer
    volumes:
      - einlass_data:/var/lib/postgresql/data
      - ./reports:/app/reports
      - ./backups:/app/backups
      - ./inbox:/app/inbox

volumes:
  einlass_data:
