services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: einlass_db
      POSTGRES_USER: einlass_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U einlass_user -d einlass_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://einlass_user:${DB_PASSWORD}@db:5432/einlass_db
      NODE_ENV: production
      PORT: 3001
      JWT_SECRET: "${JWT_SECRET:-einlass-secret-change-in-production}"
      APP_URL: "${APP_URL:-http://localhost}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-Einlassüberwachung noreply@localhost}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-net
      - frontend-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - frontend-net

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - frontend-net

volumes:
  postgres_data:

networks:
  backend-net:
    driver: bridge
  frontend-net:
    driver: bridge
