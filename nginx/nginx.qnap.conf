events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

  upstream backend {
    server backend:3001;
  }

  upstream frontend {
    server frontend:80;
  }

  # HTTP: nur für Let's Encrypt Challenge, sonst Redirect auf HTTPS
  server {
    listen 8080;
    server_name besosilu-apps.org;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host:8443$request_uri;
    }
  }

  # HTTPS
  server {
    listen 8443 ssl;
    server_name besosilu-apps.org;
    client_max_body_size 10M;

    ssl_certificate     /etc/letsencrypt/live/besosilu-apps.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/besosilu-apps.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # API → Backend
    location /api/ {
      proxy_pass http://backend/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 60s;
    }

    # Frontend (React SPA)
    location / {
      proxy_pass http://frontend/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_cache_bypass $http_upgrade;
    }
  }
}
